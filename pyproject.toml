[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ruthless-efficiency"
dynamic = ["version"]  # read from ruthless/_version.py — see [tool.hatch.version]
description = "Ruthless Efficiency — a general optimisation/search substrate (pluggable strategies + compute backends)."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Karsten Skyt" }]
keywords = ["optimization", "hyperparameter-optimization", "evolutionary-search", "optuna"]
# numpy pinned <3 so the RandomSearch RNG stream stays stable for the determinism gate (review H-D).
# pydantic pinned <3 for the same class of reason: `fingerprint_model` digests `model_dump()` output,
# so pydantic's python-mode serialisation of Path/Enum sits INSIDE the digest's blast radius. An
# unpinned major could move every consumer's persisted cache key with nothing in ruthless changing.
dependencies = ["pydantic>=2,<3", "numpy>=1.24,<3", "pyyaml>=6"]

[project.optional-dependencies]
optuna = ["optuna>=4.0"]                            # Phase 2
evolve = ["openevolve>=0.2.0"]                      # Plan 1B (hybrid: our orchestration + OpenEvolve loop)
backends = ["huggingface_hub>=0.25", "docker>=7"]   # Plan 1B: hf_jobs (+ docker). ssh uses system ssh/scp; local_cuda's torch is the consumer's.
dev = ["pytest>=8", "pytest-benchmark>=4", "hypothesis>=6", "ruff>=0.6", "pyright>=1.1.380", "import-linter>=2.0"]

[project.scripts]
ruthless = "ruthless.cli:main"

[tool.hatch.version]
# SINGLE source of truth for the version. `[project] version` used to duplicate the runtime
# `__version__` literal with nothing enforcing agreement — drift meant wheel metadata disagreeing with
# `ruthless.__version__`, and (since ADR-002) a wrong version stamped into every Result.provenance.
# Deleting the duplication beats testing for it. Bump ruthless/_version.py; everything else follows.
path = "ruthless/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["ruthless"]

[tool.hatch.build.targets.sdist]
# Keep internal dev docs and repo infrastructure out of the published sdist: the planning docs
# reference sibling repos and the dev process, and CI/issue-template config is of no use to anyone
# installing the package. The user-facing docs (README, LICENSE, NOTICE, CHANGELOG, CONTRIBUTING,
# SECURITY, CODE_OF_CONDUCT) and the design ADR/C4 still ship.
exclude = [
    # CI workflows, dependabot config, CODEOWNERS, PR/issue templates. Excluding these also makes
    # "a workflow-only change does not alter the package" true rather than nearly-true.
    "/.github",
    "/CLAUDE.md",
    "/docs/superpowers",
    "/docs/audits",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["ruthless", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
