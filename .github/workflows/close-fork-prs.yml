name: Close Fork PRs

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close-fork-pr:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Close and comment
        # NB: the previous pin was the v7.1.0 commit but was commented "# v7.0.1" — a mislabelled
        # supply-chain pin. Corrected here along with the bump. v9 dropped `require('@actions/github')`
        # and made `getOctokit` an injected param; this script uses only `github.rest.*` + `context`,
        # so it is unaffected.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `Thank you for your interest in contributing! This project is not currently accepting outside pull requests — the codebase is under active solo development with strict architectural conventions.\n\nPlease consider:\n- **Opening an issue** to discuss your idea or report a bug\n- **Forking** the repository for your own use (MIT license)\n\nSee [CONTRIBUTING.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md) for details.`
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed'
            });
