name: CI
# push scoped to branches (not tags): a v* tag push is handled by publish.yml, and limiting
# push to `main` avoids the same-repo double-run (push + pull_request both firing on a PR branch).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same ref so a new push cancels the stale run instead of queueing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v9 flipped `prune-cache` to false by default (upstream did it to reduce PyPI load). We take
      # that default deliberately: caches get larger but restore faster, and this dep tree is nowhere
      # near the 10 GB repo cache limit. Set `prune-cache: true` here to revert to pre-v9 behaviour.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install 3.10
      - run: uv venv --python 3.10
      - run: uv pip install -e ".[dev,backends,evolve,optuna]"
      - run: uv run ruff check ruthless tests
      - run: uv run ruff format --check ruthless tests
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest -v

  core-lean:
    # Proves the default install stays dependency-light: core imports + the core test subset
    # must pass WITHOUT the [backends]/[evolve]/[optuna] heavy deps (huggingface_hub/docker/openevolve/optuna).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v9 flipped `prune-cache` to false by default (upstream did it to reduce PyPI load). We take
      # that default deliberately: caches get larger but restore faster, and this dep tree is nowhere
      # near the 10 GB repo cache limit. Set `prune-cache: true` here to revert to pre-v9 behaviour.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install 3.10
      - run: uv venv --python 3.10
      - run: uv pip install -e ".[dev]"
      - run: uv run python -c "import ruthless; from ruthless.strategies.random_.strategy import RandomSearchStrategy; print(ruthless.__version__)"
      - run: uv run pytest -v --ignore=tests/backends --ignore=tests/strategies/evolve --ignore=tests/e2e/test_evolve_orchestration_gate.py --ignore=tests/strategies/optuna_ --ignore=tests/e2e/test_optuna_resume_gate.py

  core-lean-windows:
    # The cross-platform leg for cache identity. `fingerprint` digests are PERSISTED CACHE KEYS in
    # consumer storage, and consumers span Windows and Linux, so a platform-dependent digest would
    # orphan their caches silently. A Linux-only CI can never observe that. Mirrors `core-lean`
    # (lean [dev] install, core test subset) rather than matrixing the full `test` job: matrixing
    # would install openevolve/docker/huggingface_hub on Windows and turn any fingerprint change into
    # a third-party Windows-compatibility exercise.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install 3.10
      - run: uv venv --python 3.10
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest -v --ignore=tests/backends --ignore=tests/strategies/evolve --ignore=tests/e2e/test_evolve_orchestration_gate.py --ignore=tests/strategies/optuna_ --ignore=tests/e2e/test_optuna_resume_gate.py
